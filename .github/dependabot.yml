# Dependabot opens pull requests for outdated dependencies. Nothing merges by itself: each PR runs CI
# and waits for a person to review it.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all AndroidX / Compose libraries instead of a dozen.
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
